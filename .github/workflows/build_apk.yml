name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build with Gradle
      run: |
        cd android_app
        chmod +x gradlew || true
        # Agar gradle wrapper nahi hai toh android tool se generate karenge ya direct build chalayenge
        gradle wrapper --gradle-version 8.0 || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: android_app/build/outputs/apk/debug/app-debug.apk
        

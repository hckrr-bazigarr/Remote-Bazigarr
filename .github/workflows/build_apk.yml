name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Clean
      run: |
        cd android_app
        mkdir -p src/main/java/com/example/remotetool
        mkdir -p src/main
        # Ensure AndroidManifest is in standard location if not already
        if [ -f "AndroidManifest.xml" ] && [ ! -f "src/main/AndroidManifest.xml" ]; then
          mv AndroidManifest.xml src/main/
        fi
        
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android_app/build/outputs/apk/debug/app-debug.apk
        

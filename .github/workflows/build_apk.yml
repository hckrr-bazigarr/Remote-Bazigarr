name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Structure and Build APK
      run: |
        cd android_app
        mkdir -p app/src/main/java/com/example/remotetool
        mkdir -p app/src/main
        
        if [ -f "build.gradle" ]; then mv build.gradle app/; fi
        if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi
        if [ -f "MainActivity.java" ]; then mv MainActivity.java app/src/main/java/com/example/remotetool/; fi

        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android_app/app/build/outputs/apk/debug/app-debug.apk
        
